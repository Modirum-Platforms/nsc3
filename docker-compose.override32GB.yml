# docker-compose.override32GB.yml
# Using overrides in case of 32GB RAM
#   docker compose -f docker-compose.yml -f docker-compose.override32GB.yml up -d
#
# Only contains services that every current release defines. Overrides for
# services that may be absent live in companion files, because Compose adds any
# service found only in an override and then rejects it for having no image:
#   docker-compose.override32GB.optional.yml  (with optional-features.yml)
#   docker-compose.override32GB.legacy.yml    (release-4.5.3 and earlier)

services:
  nsc-scheduler-service:
    mem_limit: 2048m
    memswap_limit: 2048m
  nsc-auth-service:
    mem_limit: 1024m
    memswap_limit: 1024m
  nsc-stream-in-service:
    mem_limit: 12288m
    memswap_limit: 12288m
  nsc-live-service:
    mem_limit: 4096m
    memswap_limit: 4096m
  nsc-comms-service:
    mem_limit: 6144m
    memswap_limit: 6144m
  nsc-playback-service:
    mem_limit: 4096m
    memswap_limit: 4096m
  nsc-network-stream-service:
    mem_limit: 8192m
    memswap_limit: 8192m
  nsc-aar-worker:
    mem_limit: 8192m
    memswap_limit: 8192m
